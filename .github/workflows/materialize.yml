name: Materialize source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: contains(github.event.head_commit.message, 'Materialize LENS source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack source
        run: |
          curl -fsSL https://files.catbox.moe/m72uci.gz -o /tmp/lens-fix3.tar.gz
          tar -xzf /tmp/lens-fix3.tar.gz -C .
      - name: Commit source tree
        run: |
          git config user.name "LENS"
          git config user.email "lens@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Bound browser shutdown and stop guessing favicons"
          git push
